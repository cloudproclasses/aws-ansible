---
aws_region: ap-south-1

project_name: ansible-web-demo
instance_name: ansible-web-demo
instance_type: t3.micro

# Create this EC2 key pair in the selected region before deploying.
ec2_key_name: web-app
private_key_path: "{{ lookup('env', 'HOME') }}/.ssh/ansible-demo-key.pem"

# Amazon Linux 2023 x86_64 public SSM parameter.
ami_ssm_parameter: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

security_group_name: ansible-web-demo-sg
