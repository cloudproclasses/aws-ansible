---
- name: Provision AWS infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  environment:
    AWS_DEFAULT_REGION: "{{ aws_region }}"

  tasks:
    - name: Verify the AWS identity used by this project
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - get-caller-identity
          - --output
          - json
      register: caller_identity
      changed_when: false

    - name: Display AWS identity
      ansible.builtin.debug:
        msg: "{{ caller_identity.stdout | from_json }}"

    - name: Find the default VPC
      amazon.aws.ec2_vpc_net_info:
        filters:
          "isDefault": "true"
      register: vpc_info

    - name: Stop if no default VPC exists
      ansible.builtin.assert:
        that:
          - vpc_info.vpcs | length > 0
        fail_msg: "No default VPC found in {{ aws_region }}. Create/select a VPC and adapt this project."

    - name: Save the default VPC ID
      ansible.builtin.set_fact:
        project_vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"

    - name: Find available subnets in the default VPC
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          vpc-id: "{{ project_vpc_id }}"
          state: available
      register: subnet_info

    - name: Stop if no subnet exists
      ansible.builtin.assert:
        that:
          - subnet_info.subnets | length > 0
        fail_msg: "No available subnet found in the default VPC."

    - name: Select the first available subnet
      ansible.builtin.set_fact:
        project_subnet_id: "{{ subnet_info.subnets[0].subnet_id }}"

    - name: Get the latest Amazon Linux 2023 AMI ID from AWS Systems Manager Parameter Store
      ansible.builtin.command:
        argv:
          - aws
          - ssm
          - get-parameter
          - --name
          - "{{ ami_ssm_parameter }}"
          - --query
          - Parameter.Value
          - --output
          - text
      register: ami_result
      changed_when: false

    - name: Create or update the web server security group
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        description: "Security group managed by the Ansible AWS demo"
        vpc_id: "{{ project_vpc_id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [80]
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow HTTP web traffic
          - proto: tcp
            ports: [22]
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow SSH
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow outbound traffic
        tags:
          Project: "{{ project_name }}"
          ManagedBy: Ansible
        state: present
      register: security_group

    - name: Launch or ensure the EC2 instance is present
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        key_name: "{{ ec2_key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_result.stdout | trim }}"
        vpc_subnet_id: "{{ project_subnet_id }}"
        security_groups:
          - "{{ security_group_name }}"
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/xvda
            ebs:
              volume_size: 8
              volume_type: gp3
              encrypted: true
              delete_on_termination: true
        tags:
          Project: "{{ project_name }}"
          ManagedBy: Ansible
          Name: "{{ instance_name }}"
        wait: true
        state: running
      register: ec2_result

    - name: Add the new EC2 instance to the in-memory webservers group
      ansible.builtin.add_host:
        name: "{{ ec2_result.instances[0].public_ip_address }}"
        groups: webservers
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "{{ private_key_path }}"
        ansible_python_interpreter: /usr/bin/python3

    - name: Display the web server address
      ansible.builtin.debug:
        msg:
          - "EC2 public IP: {{ ec2_result.instances[0].public_ip_address }}"
          - "Website: http://{{ ec2_result.instances[0].public_ip_address }}/"

- name: Configure the EC2 web server
  hosts: webservers
  become: true
  gather_facts: true
  tasks:
    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Publish the demo home page
      ansible.builtin.copy:
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: "0644"
        content: |
          <!doctype html>
          <html>
          <head><title>Ansible AWS Demo</title></head>
          <body>
            <h1>It works!</h1>
            <p>This EC2 web server was provisioned and configured using Ansible.</p>
            <p>Project: {{ hostvars['localhost'].project_name | default('ansible-web-demo') }}</p>
          </body>
          </html>
      notify: Restart Nginx

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
